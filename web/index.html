<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>leeter</title>
    <script>
      // Set the theme before React renders to avoid a light flash in dark mode.
      try {
        if (localStorage.getItem("leeter-theme") === "dark") {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      } catch (_e) {
        /* stay light */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
